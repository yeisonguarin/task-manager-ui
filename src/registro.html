<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Task Manager</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body>
    <div class="form-container">
        <div class="form-box">
            <h1>Registro de Usuario</h1>
            <p>Crea una cuenta para comenzar</p>

            <form id="registroForm">
                <div class="input-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Yeison Guarin" required>
                </div>

                <div class="input-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="input-group">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" required>
                </div>

                <div class="botones">
                    <button type="submit" class="btn-registrar">Registrarse</button>
                    <a href="dashboard.html"><button type="button" class="btn-cancelar">Cancelar</button></a>
                </div>

                <p class="login-link">¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
            </form>
        </div>
    </div>
</body>
</html>
